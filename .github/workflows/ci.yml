name: CI
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testes unitários (dados, regras de perigo, motor)
        run: npm test
      - name: index.html está em dia com src/?
        run: npm run build:check
